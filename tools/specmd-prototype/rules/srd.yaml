# The SRD rules the Markdown diagnostics enforce, as data (GH-2589 R4): a new
# document type is a new file of this shape, not new parser code. Messages
# quote the rule they enforce by its path in this file.
document_type: srd

frontmatter:
  required: [id, title]
  allowed: [id, title, status, retired_in, replaced_by, depends_on, derived_from]
  # The id must equal the file name without its extension.
  id_matches_filename: true

# Heading grammar: which marker tag may open a heading at which depth, inside
# which parent node. "document" is the body itself.
nodes:
  document_field:
    tag: field
    level: 2
    parent: document
  requirement_group:
    tag: req
    level: 2
    parent: document
    id_pattern: '^R[0-9]+$'
  group_field:
    tag: field
    level: 3
    parent: requirement_group
  requirement_item:
    tag: req
    level: 3
    parent: requirement_group
    id_pattern: '^R[0-9]+\.[0-9]+$'
    # The item's id extends its group's id: R2.1 belongs under R2.
    id_extends_parent: true
    heading_is_id: true
    requires_content: true
    attributes: [weight, status, retired_in, replaced_by, derived_from]
  item_field:
    tag: field
    level: 4
    parent: requirement_item
  acceptance_criterion:
    tag: ac
    level: 3
    parent: acceptance_criteria
    id_pattern: '^AC[0-9]+$'
    heading_is_id: true
    requires_content: true
    attributes: [traces, status, retired_in, replaced_by, derived_from]
  criterion_field:
    tag: field
    level: 4
    parent: acceptance_criterion

# Typed fields: where each may appear and the shape its content must take.
# A field not listed here is an extension: allowed at any field position,
# shape free.
fields:
  problem:
    in: [document_field]
    shape: prose
  goals:
    in: [document_field]
    shape: list
    item_prefix: '^G[0-9]+: '
  non_goals:
    in: [document_field]
    shape: list
  assumptions:
    in: [document_field]
    shape: list
    item_prefix: '^A[0-9]+: '
  acceptance_criteria:
    in: [document_field]
    shape: empty
  needs_clarification:
    in: [document_field]
    shape: table
    columns: [id, question]
  evidence:
    in: [item_field]
    shape: prose
  endpoints:
    in: [item_field]
    shape: table
    columns: [path, owner]

# Fields every SRD must carry (design.yaml document_types.srd
# required_fields), and the requirement groups it must have.
required_fields: [problem, goals, non_goals, acceptance_criteria]
requires_requirement_groups: true
# A stub that points elsewhere carries no content of its own; its status says
# so, and the required-content checks do not apply to it.
required_fields_exempt_status: [relocated, retired]

# Marker attribute shapes.
attributes:
  weight: integer
  status: text
  retired_in: text
  replaced_by: list
  derived_from: references
  traces: list
# A criterion's traces must be non-empty and name requirement ids.
criterion_traces:
  min: 1
  id_pattern: '^R[0-9]+(\.[0-9]+)?$'

# Prose containment: an RFC 2119 keyword outside any req-tagged block states a
# requirement nobody can trace. Uppercase keywords always count; "shall" is the
# corpus's own normative verb and counts in lowercase too.
prose_containment:
  keywords: [MUST, MUST NOT, REQUIRED, SHALL, SHALL NOT, SHOULD, SHOULD NOT, RECOMMENDED, MAY, OPTIONAL, shall, shall not]
  # Requirement groups, items, and their fields sit inside a req-tagged block;
  # document fields and the acceptance criteria do not.
  outside: [document_field, acceptance_criterion, criterion_field]
