      required_fields: [scope, candidates, findings, rejected_candidates]
      prose_containment:
        keywords: [MUST, MUST NOT, REQUIRED, SHALL, SHALL NOT, SHOULD, SHOULD NOT, RECOMMENDED, MAY, OPTIONAL, shall, shall not]
