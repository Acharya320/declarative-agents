completeness_checks:
- id: C1
  check: The document parses; mage audit reports no markdown-format finding.
- id: C2
  check: IDs match filenames or existing corpus conventions.
- id: C3
  check: New use cases trace to SRDs and a test suite.
- id: C4
  check: New SRD requirements trace to acceptance criteria.
- id: C5
  check: mage audit reports no new warnings for touched docs.
- id: C6
  check: mage audit reports no retired-id-missing finding (every id present at the
    previous release tag is present, or retired, at HEAD).
- id: C7
  check: mage audit reports no unresolved-clarification finding.
