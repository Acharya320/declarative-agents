# Documentation Design Constitution

id: design
title: Documentation Design Constitution
purpose: 'We use this constitution when creating or changing VISION, ARCHITECTURE,

  SRDs, use cases, test suites, semantic models, config-format specs, and

  other project documentation. The goal is a spec corpus that humans can read

  and tools can validate.

  '
articles:
- id: D1
  title: Specification-driven development
  rule: 'Specifications lead implementation. New behavior starts with a SRD, use

    case, test suite, or explicit documentation issue before code changes.

    Code changes should point back to the requirement or design artifact they

    implement.

    '
- id: D2
  title: YAML-first structured docs
  rule: 'Use YAML for structured project artifacts. This includes VISION,

    ARCHITECTURE, SPECIFICATIONS, road-map, SRDs, use cases, test suites,

    semantic models, config-format specs, and constitutions. Use Markdown for

    prose-heavy operator guides and historical design notes.

    '
- id: D3
  title: Traceability
  rule: 'Vision explains goals and boundaries. Architecture explains components

    and flows. SRDs define numbered requirements. Use cases exercise SRDs

    through touchpoints. Test suites validate use cases and SRD acceptance

    criteria. Code and config changes should keep that chain intact.

    '
- id: D4
  title: Profile-first runtime docs
  rule: 'Agent Core behavior is profile-driven. Documentation should describe

    profiles, machine.yaml, tools.yaml, tool declarations, and boundary-tool

    config as the agent program. Do not describe generator, evaluator,

    planner, jurist, bench, history, or rollback as separate Go binaries.

    '
- id: D5
  title: Tool language boundary
  rule: 'MachineSpec owns workflow sequencing. ToolDef owns one vocabulary word:

    input, output, emitted signals, side effects, errors, and undo or

    compensation. Documentation must call out boundary tools when they cross

    a model, human, child process, external API, nested machine, or workspace.

    '
- id: D6
  title: Identifiers are immutable
  rule: 'An SRD id (srdNNN), a requirement id (Rn, Rn.m), an acceptance

    criterion id (ACn), a use-case id, and a test-suite id are never

    renumbered or reused once a release tag contains them. An entry that no

    longer applies keeps its id with status: retired, the release that

    retired it (retired_in), and the ids that replace it (replaced_by,

    possibly empty). Merging or splitting SRDs retires the old ids with

    pointers. This is the rule application-dsl-spec/language.yaml already

    states for statements, applied to the corpus.

    '
documentation_standards:
  style: 'Write short, exact sentences. Use active voice. Remove filler. Prefer

    exact paths, symbols, and commands over broad claims.

    '
  voice: 'Use "we" for project behavior and obligations. Use present tense for

    current behavior. Use planned status only when implementation or tests are

    missing.

    '
  diction: 'Avoid hype, vague intensifiers, stock transitions, and claims that do not

    name a behavior, file, command, or contract.

    '
  formatting:
    prose: 'Use paragraph form for explanation. Use lists for fields, steps, and

      checklists. Keep table content short when tables are useful.

      '
    yaml: 'Use lowercase snake_case field names. Use block literals for multi-sentence

      prose. Keep IDs stable once referenced.

      '
    diagrams: 'Use Mermaid in multiline YAML strings for diagrams. Do not add generated

      image files.

      '
  external_references: 'A requirement that exists because a parent repository''s requirement

    demands it says so with a derived_from entry on the SRD, the requirement

    item, or the acceptance criterion: repo, the release it was validated

    against, srd, item, and an optional reason. Resolution is offline against

    a mandated clone cache, a sibling checkout named after the repository

    (docs/external-checkouts.yaml overrides the location); the tracked

    target pin per parent lives in docs/external-pins.yaml. An entry without

    a release resolves against the cache HEAD during co-development and is

    refused at release. A stale entry -- the cited item changed between the

    validated release and the tracked pin -- is resolved by revalidating the

    local requirement and re-pinning the entry in the same change. mage

    upgrade (or mage upgrade:to for a named release) moves the pin and

    re-pins every entry whose cited item is byte-identical across the two

    releases; mage upgrade:status prints the

    entries still behind their pins, the pre-planning worklist.

    '
  success_criteria: 'A success criterion states a measurable outcome in domain terms and

    names no implementation technology. A criterion a person cannot check

    without reading the implementation is a design note, not a criterion.

    '
  clarification_marker: 'A corpus document records a decision nobody has made as an entry in

    its optional needs_clarification list. Each entry carries id, the

    requirement item, acceptance criterion, or success criterion the question

    blocks, and question, the decision to make. A document with a non-empty

    list is not ready. A person resolves an entry by making the decision,

    editing the blocked entry in place, and deleting the entry, never by

    answering in a comment or a separate note. Tracker issues live outside

    the corpus and keep the inline literal marker [NEEDS CLARIFICATION:

    question] instead (issue-format.md). mage clarify lists every open

    entry across participating modules; run it and resolve the entries

    before planning work on the document.

    '
document_types:
  vision:
    location: docs/VISION.yaml
    required_fields:
    - id
    - title
    - executive_summary
    - problem
    - what_this_does
    - why_we_build_this
    - success_criteria
    - not
    purpose: Defines what Agent Core is, why it exists, and what it excludes.
    markdown:
      location: docs/VISION.md
      frontmatter:
        required: [id, title]
        allowed: [id, title]
      nodes:
        document_field: {tag: field, level: 2, parent: document, heading: free, content: any}
      fields:
        executive_summary: {in: [document_field], shape: prose}
        problem: {in: [document_field], shape: prose}
        what_this_does: {in: [document_field], shape: prose}
        why_we_build_this: {in: [document_field], shape: prose}
        success_criteria: {in: [document_field], shape: list, item_pattern: '^[a-z][a-z0-9_]*: ', value: keyed}
        not: {in: [document_field], shape: list}
        canonical_documents: {in: [document_field], shape: list}
      required_fields: [executive_summary, problem, what_this_does, why_we_build_this, success_criteria, not]
      prose_containment:
        keywords: [MUST, MUST NOT, REQUIRED, SHALL, SHALL NOT, SHOULD, SHOULD NOT, RECOMMENDED, MAY, OPTIONAL, shall, shall not]
        outside: [document_field]
  architecture:
    location: docs/ARCHITECTURE.yaml
    required_fields:
    - id
    - title
    - overview
    - interfaces
    - components
    - design_decisions
    - technology_choices
    - project_structure
    - implementation_status
    - related_documents
    purpose: Defines layers, components, flows, decisions, and source layout.
    markdown:
      location: docs/ARCHITECTURE.md
      frontmatter:
        required: [id, title]
        allowed: [id, title]
      nodes:
        document_field: {tag: field, level: 2, parent: document, heading: free, content: any}
        interface:
          tag: interface
          level: 3
          parent: 'field:interfaces'
          heading: id
          content: prose
          unique_id: true
          yaml: {from: interfaces, records: list, id: name, content: summary}
        interface_field: {tag: field, level: 4, parent: interface, heading: free, content: any}
        component:
          tag: component
          level: 3
          parent: 'field:components'
          heading: id
          content: prose
          unique_id: true
          yaml: {from: components, records: list, id: name, content: responsibility}
        component_field: {tag: field, level: 4, parent: component, heading: free, content: any}
        decision:
          tag: decision
          level: 3
          parent: 'field:design_decisions'
          id_pattern: '^[0-9]+$'
          heading: id_title
          content: prose
          unique_id: true
          yaml: {from: design_decisions, records: list, id: id, title: title, content: decision}
        decision_field: {tag: field, level: 4, parent: decision, heading: free, content: any}
      fields:
        interfaces: {in: [document_field], shape: empty}
        components: {in: [document_field], shape: empty}
        design_decisions: {in: [document_field], shape: empty}
        technology_choices: {in: [document_field], shape: table, columns: [component, technology, purpose]}
        capabilities: {in: [component_field], shape: list}
        benefits: {in: [decision_field], shape: list}
        alternatives_rejected: {in: [decision_field], shape: list}
      required_fields: [overview, interfaces, components, design_decisions, technology_choices, project_structure, implementation_status, related_documents]
      prose_containment:
        keywords: [MUST, MUST NOT, REQUIRED, SHALL, SHALL NOT, SHOULD, SHOULD NOT, RECOMMENDED, MAY, OPTIONAL, shall, shall not]
        outside: [document_field, interface, component, component_field, decision, decision_field]
  specifications:
    location: docs/SPECIFICATIONS.yaml
    required_fields:
    - id
    - title
    - overview
    - roadmap_summary
    - foundation_document_index
    - srd_index
    - config_format_index
    - semantic_model_index
    - use_case_index
    - test_suite_index
    - coverage_gaps
    purpose: Indexes the specification corpus and records known coverage gaps.
    markdown:
      location: docs/SPECIFICATIONS.md
      frontmatter:
        required: [id, title]
        allowed: [id, title]
      nodes:
        document_field: {tag: field, level: 2, parent: document, heading: free, content: any}
      fields:
        overview: {in: [document_field], shape: prose}
      required_fields: [overview, roadmap_summary, foundation_document_index, srd_index, config_format_index, semantic_model_index, use_case_index, test_suite_index, coverage_gaps]
      prose_containment:
        keywords: [MUST, MUST NOT, REQUIRED, SHALL, SHALL NOT, SHOULD, SHOULD NOT, RECOMMENDED, MAY, OPTIONAL, shall, shall not]
        outside: [document_field]
  roadmap:
    location: docs/road-map.yaml
    required_fields:
    - id
    - title
    - releases
    purpose: Assigns SRDs and use cases to releases and status values.
    markdown:
      location: docs/road-map.md
      frontmatter:
        required: [id, title]
        allowed: [id, title]
      nodes:
        document_field: {tag: field, level: 2, parent: document, heading: free, content: any}
        release:
          tag: release
          level: 2
          parent: document
          id_pattern: '^[0-9]{2}\.[0-9]+$'
          heading: id_title
          content: any
          unique_id: true
          attributes: [status]
          yaml: {from: releases, records: list, id: version, title: name, content: description}
        release_field: {tag: field, level: 3, parent: release, heading: free, content: any}
      fields:
        overview: {in: [document_field], shape: prose}
      required_nodes: {release: 1}
      attributes:
        status: text
      prose_containment:
        keywords: [MUST, MUST NOT, REQUIRED, SHALL, SHALL NOT, SHOULD, SHOULD NOT, RECOMMENDED, MAY, OPTIONAL, shall, shall not]
        outside: [document_field, release, release_field]
  pattern_language:
    location: docs/pattern-language.yaml
    required_fields:
    - title
    - version
    - patterns
    - grammar_check
    - bibliography
    purpose: Defines the connected pattern grammar for a repository scope.
    markdown:
      location: docs/pattern-language.md
      frontmatter:
        required: [title, version]
        allowed: [id, title, version, based_on, extends]
      nodes:
        document_field: {tag: field, level: 2, parent: document, heading: free, content: any}
        pattern:
          tag: pattern
          level: 3
          parent: 'field:patterns'
          id_pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          heading: free
          content: none
          unique_id: true
          attributes: [number]
          required_fields: [intent, problem, solution]
          yaml: {from: patterns, records: list, id: id, title: name}
        pattern_field: {tag: field, level: 4, parent: pattern, heading: free, content: any}
      fields:
        patterns: {in: [document_field], shape: empty}
        intent: {in: [pattern_field], shape: prose}
        problem: {in: [pattern_field], shape: prose}
        solution: {in: [pattern_field], shape: prose}
        forces: {in: [pattern_field], shape: list}
        also_known_as: {in: [pattern_field], shape: list}
      required_fields: [patterns, grammar_check, bibliography]
      required_nodes: {pattern: 1}
      attributes:
        number: integer
      prose_containment:
        keywords: [MUST, MUST NOT, REQUIRED, SHALL, SHALL NOT, SHOULD, SHOULD NOT, RECOMMENDED, MAY, OPTIONAL, shall, shall not]
        outside: [document_field, pattern_field]
  engineering_guideline:
    location: docs/engineering/engNN-short-name.yaml
    required_fields:
    - id
    - title
    - introduction
    - sections
    - references
    purpose: Defines repository-wide engineering practices shared by modules.
    markdown:
      location: docs/engineering/engNN-short-name.md
      frontmatter:
        required: [id, title]
        allowed: [id, title]
        id_matches_filename: true
      nodes:
        document_field: {tag: field, level: 2, parent: document, heading: free, content: any}
        section:
          tag: section
          level: 2
          parent: document
          id_pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          heading: free
          content: any
          unique_id: true
          yaml: {from: sections, records: list, id: id, title: title, content: content, derive_id: slug}
      fields:
        introduction: {in: [document_field], shape: prose}
        references: {in: [document_field], shape: list}
      required_fields: [introduction, references]
      required_nodes: {section: 1}
      prose_containment:
        keywords: [MUST, MUST NOT, REQUIRED, SHALL, SHALL NOT, SHOULD, SHOULD NOT, RECOMMENDED, MAY, OPTIONAL, shall, shall not]
        outside: [document_field, section]
  srd:
    location: docs/specs/software-requirements/srdNNN-short-name.yaml
    required_fields:
    - id
    - title
    - problem
    - goals
    - requirements
    - non_goals
    - acceptance_criteria
    numbering:
      goals: G1, G2, G3
      requirement_groups: R1, R2, R3
      requirement_items: R1.1, R1.2, R2.1
      acceptance_criteria: AC1, AC2, AC3
    optional_fields:
    - status
    - retired_in
    - replaced_by
    - needs_clarification
    - assumptions
    - derived_from
    provenance: 'derived_from (external_references) applies to the document and to an

      individual requirement item or acceptance criterion.

      '
    retirement: 'The three optional fields implement D6 on the document and on a

      requirement item or acceptance criterion retired individually. The

      use_case and test_suite types take the same optional fields with the

      same meaning.

      '
    purpose: Defines product or runtime requirements with checkable criteria.
    markdown:
      location: docs/specs/software-requirements/srdNNN-short-name.md
      frontmatter:
        required: [id, title]
        allowed: [id, title, status, retired_in, replaced_by, depends_on, derived_from]
        id_matches_filename: true
      nodes:
        document_field: {tag: field, level: 2, parent: document, heading: free, content: any}
        requirement_group:
          tag: req
          level: 2
          parent: document
          id_pattern: '^R[0-9]+$'
          heading: id_title
          content: none
          unique_id: true
          yaml: {from: requirements, records: map, id: id, title: title}
        group_field: {tag: field, level: 3, parent: requirement_group, heading: free, content: any}
        requirement_item:
          tag: req
          level: 3
          parent: requirement_group
          id_pattern: '^R[0-9]+(\.[0-9]+){1,2}[a-z]?$'
          id_extends_parent: true
          heading: id
          content: prose
          unique_id: true
          attributes: [weight, status, retired_in, replaced_by, derived_from]
          yaml: {from: items, records: list, id: id, content: text, keyed: true}
        item_field: {tag: field, level: 4, parent: requirement_item, heading: free, content: any}
        acceptance_criterion:
          tag: ac
          level: 3
          parent: field:acceptance_criteria
          id_pattern: '^AC[0-9]+$'
          heading: id
          content: prose
          unique_id: true
          attributes: [status, retired_in, replaced_by, derived_from]
          required_fields: [traces]
          yaml: {from: acceptance_criteria, records: list, id: id, content: criterion}
        criterion_field: {tag: field, level: 4, parent: acceptance_criterion, heading: free, content: any}
      fields:
        problem: {in: [document_field], shape: prose}
        goals: {in: [document_field], shape: list, item_pattern: '^G[0-9]+: ', value: outline, id: id, content: text}
        non_goals: {in: [document_field], shape: list, heading: Non-goals}
        assumptions: {in: [document_field], shape: list, item_pattern: '^A[0-9]+: ', value: outline, id: id, content: text}
        acceptance_criteria: {in: [document_field], shape: empty}
        needs_clarification: {in: [document_field], shape: table, columns: [id, question]}
        evidence: {in: [item_field], shape: prose}
        endpoints: {in: [item_field], shape: table, columns: [path, owner]}
        traces: {in: [criterion_field], shape: list, item_pattern: '^R[0-9]+(\.[0-9]+){0,2}[a-z]?$'}
      required_fields: [problem, goals, non_goals, acceptance_criteria]
      required_nodes: {requirement_group: 1}
      exempt_status: [relocated, retired]
      attributes:
        weight: integer
        status: text
        retired_in: text
        replaced_by: list
        derived_from: references
      prose_containment:
        keywords: [MUST, MUST NOT, REQUIRED, SHALL, SHALL NOT, SHOULD, SHOULD NOT, RECOMMENDED, MAY, OPTIONAL, shall, shall not]
        outside: [document_field, acceptance_criterion, criterion_field]
  use_case:
    location: docs/specs/use-cases/relNN.N-ucNNN-short-name.yaml
    required_fields:
    - id
    - title
    - summary
    - actor
    - trigger
    - flow
    - touchpoints
    - success_criteria
    - out_of_scope
    numbering:
      flow_steps: F1, F2, F3
      touchpoints: T1, T2, T3
      success_criteria: S1, S2, S3
      assumptions: A1, A2, A3
      edge_cases: E1, E2, E3
    optional_fields:
    - status
    - retired_in
    - replaced_by
    - needs_clarification
    - assumptions
    - edge_cases
    - priority
    priority: 'P1 must ship for the use case''s release, P2 should, P3 could.

      An absent priority means unranked. No other value is valid. A use case

      is the unit of scheduling here, so priority lives on it rather than on

      a separate user-story type.

      '
    purpose: Describes one end-to-end path through the architecture.
    markdown:
      location: docs/specs/use-cases/relNN.N-ucNNN-short-name.md
      frontmatter:
        required: [id, title]
        allowed: [id, title, status, priority, retired_in, replaced_by, test_suite]
        id_matches_filename: true
      nodes:
        document_field: {tag: field, level: 2, parent: document, heading: free, content: any}
        success_criterion:
          tag: sc
          level: 3
          parent: 'field:success_criteria'
          id_pattern: '^S[0-9]+$'
          heading: id
          content: prose
          unique_id: true
          attributes: [status, retired_in, replaced_by]
          yaml: {from: success_criteria, records: list, id: id, content: criterion}
        criterion_field: {tag: field, level: 4, parent: success_criterion, heading: free, content: any}
      fields:
        summary: {in: [document_field], shape: prose}
        actor: {in: [document_field], shape: prose}
        trigger: {in: [document_field], shape: prose}
        preconditions: {in: [document_field], shape: list}
        flow: {in: [document_field], shape: list, item_pattern: '^F[0-9]+: ', value: outline, id: id, content: text}
        touchpoints: {in: [document_field], shape: table, columns: [id, target, reason], split: ' -- '}
        success_criteria: {in: [document_field], shape: empty}
        failure_scenarios: {in: [document_field], shape: table, columns: [id, scenario, expected]}
        out_of_scope: {in: [document_field], shape: list}
        assumptions: {in: [document_field], shape: list, item_pattern: '^A[0-9]+: '}
        edge_cases: {in: [document_field], shape: list, item_pattern: '^E[0-9]+: '}
        needs_clarification: {in: [document_field], shape: table, columns: [id, question]}
        traces: {in: [criterion_field], shape: list}
      required_fields: [summary, actor, trigger, flow, touchpoints, success_criteria, out_of_scope]
      exempt_status: [relocated, retired]
      attributes:
        status: text
        retired_in: text
        replaced_by: list
      prose_containment:
        keywords: [MUST, MUST NOT, REQUIRED, SHALL, SHALL NOT, SHOULD, SHOULD NOT, RECOMMENDED, MAY, OPTIONAL, shall, shall not]
        outside: [document_field, success_criterion, criterion_field]
  test_suite:
    location: docs/specs/test-suites/test-relNN.N-short-name.yaml
    required_fields:
    - id
    - title
    - release
    - traces
    - preconditions
    - test_cases
    optional_fields:
    - status
    - retired_in
    - replaced_by
    - needs_clarification
    purpose: Maps release use cases and SRD criteria to named tests.
    markdown:
      location: docs/specs/test-suites/test-relNN.N-short-name.md
      frontmatter:
        required: [id, title, release]
        allowed: [id, title, release, status, retired_in, replaced_by]
        id_matches_filename: true
      nodes:
        document_field: {tag: field, level: 2, parent: document, heading: free, content: any}
        test_case:
          tag: case
          level: 3
          parent: 'field:test_cases'
          heading: id
          content: any
          unique_id: true
          attributes: [status, retired_in, replaced_by]
          yaml: {from: test_cases, records: list, id: name, content: description}
        case_field: {tag: field, level: 4, parent: test_case, heading: free, content: any}
      fields:
        overview: {in: [document_field], shape: prose}
        traces: {in: [document_field, case_field], shape: list}
        preconditions: {in: [document_field], shape: list}
        test_cases: {in: [document_field], shape: empty}
        needs_clarification: {in: [document_field], shape: table, columns: [id, question]}
      required_fields: [traces, preconditions, test_cases]
      exempt_status: [relocated, retired]
      attributes:
        status: text
        retired_in: text
        replaced_by: list
      prose_containment:
        keywords: [MUST, MUST NOT, REQUIRED, SHALL, SHALL NOT, SHOULD, SHOULD NOT, RECOMMENDED, MAY, OPTIONAL, shall, shall not]
        outside: [document_field, test_case, case_field]
  audit_register:
    location: docs/specs/audits/name.yaml
    required_fields:
    - id
    - title
    - audit_date
    - scope
    - candidates
    - findings
    - rejected_candidates
    purpose: Records one recurring audit run and every candidate disposition.
    markdown:
      location: docs/specs/audits/name-register.md
      frontmatter:
        required: [id, title, audit_date]
        allowed: [id, title, audit_date]
      nodes:
        document_field: {tag: field, level: 2, parent: document, heading: free, content: any}
      fields:
        references: {in: [document_field], shape: list}
      required_fields: [scope, candidates, findings, rejected_candidates]
      prose_containment:
        keywords: [MUST, MUST NOT, REQUIRED, SHALL, SHALL NOT, SHOULD, SHOULD NOT, RECOMMENDED, MAY, OPTIONAL, shall, shall not]
        outside: [document_field]
  audit_report:
    location: docs/specs/audits/name.md
    format: markdown
    required_fields: []
    purpose: Preserves a prose-heavy audit narrative and its evidence.
    markdown: native Markdown already (format markdown); it declares no structure, so it takes no rule data.
  semantic_model:
    location: docs/specs/semantic-models/name.yaml
    required_fields:
    - id
    - title
    - purpose
    purpose: Defines vocabulary, state ownership, or cross-cutting concepts.
    markdown:
      location: docs/specs/semantic-models/name.md
      frontmatter:
        required: [id, title]
        allowed: [id, title, status]
      nodes:
        document_field: {tag: field, level: 2, parent: document, heading: free, content: any}
      fields:
        purpose: {in: [document_field], shape: prose}
        related_documents: {in: [document_field], shape: list}
        non_goals: {in: [document_field], shape: list}
        invariants: {in: [document_field], shape: list}
      required_fields: [purpose]
      prose_containment:
        keywords: [MUST, MUST NOT, REQUIRED, SHALL, SHALL NOT, SHOULD, SHOULD NOT, RECOMMENDED, MAY, OPTIONAL, shall, shall not]
        outside: [document_field]
  config_format:
    location: docs/specs/config-formats/name.yaml
    required_fields:
    - id
    - title
    - purpose
    purpose: Defines machine-readable YAML formats used by the runtime.
    markdown:
      location: docs/specs/config-formats/name.md
      frontmatter:
        required: [id, title]
        allowed: [id, title]
      nodes:
        document_field: {tag: field, level: 2, parent: document, heading: free, content: any}
      fields:
        purpose: {in: [document_field], shape: prose}
        related_documents: {in: [document_field], shape: list}
        implementation: {in: [document_field], shape: list}
      required_fields: [purpose]
      prose_containment:
        keywords: [MUST, MUST NOT, REQUIRED, SHALL, SHALL NOT, SHOULD, SHOULD NOT, RECOMMENDED, MAY, OPTIONAL, shall, shall not]
        outside: [document_field]
  constitution:
    location: docs/constitutions/name.yaml
    required_fields:
    - id
    - title
    - purpose
    purpose: Defines rules for agents and contributors working in this repo.
    markdown:
      location: docs/constitutions/name.md
      exclude: [docs/constitutions/design.yaml]
      frontmatter:
        required: [id, title]
        allowed: [id, title]
        id_matches_filename: true
      nodes:
        document_field: {tag: field, level: 2, parent: document, heading: free, content: any}
        article:
          tag: article
          level: 3
          parent: 'field:articles'
          id_pattern: '^[A-Z][0-9]+$'
          heading: id_title
          content: prose
          unique_id: true
          yaml: {from: articles, records: list, id: id, title: title, content: rule}
        article_field: {tag: field, level: 4, parent: article, heading: free, content: any}
      fields:
        purpose: {in: [document_field], shape: prose}
        references: {in: [document_field], shape: list}
        articles: {in: [document_field], shape: empty}
        review_checklist: {in: [document_field], shape: list}
      required_fields: [purpose]
      prose_containment:
        keywords: [MUST, MUST NOT, REQUIRED, SHALL, SHALL NOT, SHOULD, SHOULD NOT, RECOMMENDED, MAY, OPTIONAL, shall, shall not]
        outside: [document_field, article_field]
  migration:
    location: docs/migrations/name.yaml
    required_fields:
    - id
    - title
    - status
    purpose: Records a source-layout or compatibility transition.
    markdown:
      location: docs/migrations/name.md
      frontmatter:
        required: [id, title, status]
        allowed: [id, title, status, release, root_release, legacy_release_alias, supersedes, issue]
      nodes:
        document_field: {tag: field, level: 2, parent: document, heading: free, content: any}
      fields:
        summary: {in: [document_field], shape: prose}
        evidence: {in: [document_field], shape: list}
      prose_containment:
        keywords: [MUST, MUST NOT, REQUIRED, SHALL, SHALL NOT, SHOULD, SHOULD NOT, RECOMMENDED, MAY, OPTIONAL, shall, shall not]
        outside: [document_field]
  guide:
    location: docs/guides/name.md
    format: markdown
    required_fields: []
    purpose: Provides prose-heavy operator or developer guidance.
    markdown: native Markdown already (format markdown); it declares no structure, so it takes no rule data.
  stats_baseline:
    location: docs/stats/name.json
    format: json
    required_fields: []
    purpose: Records deterministic generated metrics before a measured migration.
    markdown: not applicable; generated JSON metrics, not a document a person authors.
  corpus_charter:
    location: docs/corpus-charter.yaml
    required_fields:
    - id
    - title
    - checks
    purpose: Names the specification-corpus checks this module's audit gates on.
    markdown: stays YAML; executable check plans the audit runs (spec.Charter), not prose a person reads.
manual_invariant_schema:
  purpose: |
    A judge may adjudicate a manual pattern invariant only after the invariant
    satisfies this schema. The mechanical layer supplies a finite pair set.
    The judge answers one question for each pair and does not search the
    repository.
  rationale: |
    The 2026-08-10 audit searched 121 candidates and rejected 71. A judge that
    also searches has no stable denominator, so its precision cannot be
    measured.
  required_fields:
  - id
  - rule
  - pairs
  - question
  - evidence_required
  - labeled_examples
  - disposition
  fields:
    id: |
      The stable pattern invariant id from
      design-patterns/pattern-language.yaml.
    rule: |
      One normative sentence that states the configuration the invariant
      requires.
    pairs:
      purpose: |
        Defines how a mechanical producer enumerates every declaration and
        implementation pair before the judge runs.
      required_fields:
      - producer
      - declaration
      - implementation
      producer: |
        Names the command, check, or deterministic inventory that emits the
        finite pair set.
      declaration: |
        Names the declaration-side path, field, or symbol included in each
        pair.
      implementation: |
        Names the implementation-side path, function, or symbol included in
        each pair.
    question: |
      One bounded question whose complete answer is yes or no for one supplied
      pair.
    evidence_required:
      purpose: |
        Defines the exact declaration and implementation evidence a verdict
        must quote.
      required_fields:
      - declaration
      - implementation
    labeled_examples: |
      Repository examples labeled violations and non_violations. These examples
      form the judge regression suite and measure precision before a run is
      trusted.
    disposition: |
      Defines both verdict outcomes. A confirmed finding cites this invariant
      and proposes a replacement mechanical_check or conformance_test. A
      non-violation records why the pair satisfies the rule.
  run_rules:
    bounded_input: |
      The judge receives the complete mechanically produced pair set. It does
      not search for additional candidates. Pair count is the denominator for
      precision.
    evidence: |
      Discard a verdict that does not quote the required evidence from both
      sides of its pair.
    reproduction: |
      A yes verdict is not a finding unless an independent run reproduces the
      answer from the same pair and quotes compatible evidence.
    citation: |
      Every finding cites the violated invariant id. If no invariant covers a
      concern, propose an invariant and do not file a remediation issue.
    retirement: |
      The judge discovers hard checks; it is not a standing inspector. Every
      confirmed finding proposes the mechanical check or conformance test that
      will replace that judgment for the detected case.
  examples:
  - id: P3.2
    rule: |
      A tool contract represents one agent-selectable domain operation and
      does not hide separately selectable effects or rollback boundaries.
    pairs:
      producer: |
        Join every selected ToolDef by init name to its Builder,
        Command.Execute, and Undo symbols.
      declaration: |
        ToolDef problem, requirements, emits, side_effects, reversibility, and
        undo fields.
      implementation: |
        The matched Builder, Command.Execute, Undo, and directly called
        effect-owning functions.
    question: |
      Does this implementation perform more than one independently selectable
      domain operation or rollback boundary behind the supplied ToolDef?
    evidence_required:
      declaration: |
        Quote the ToolDef operation, emitted outcomes, declared effects, and
        reversal boundary.
      implementation: |
        Quote the separate effects, branch, signal, or reversal boundaries that
        make the operations independently selectable.
    labeled_examples:
      violations:
      - label: spool_span_stats (GH-1572)
        basis: |
          One declared word returned two independent analytical results behind
          one signal.
      non_violations:
      - label: delay
        basis: |
          One bounded wait emits elapsed or deadline while retry sequencing
          remains in MachineSpec.
      - label: invoke_llm
        basis: |
          Prompt assembly, provider adaptation, and response normalization
          implement one declared inference transaction.
    disposition:
      confirmed: |
        Cite P3.2 and propose a conformance test that exposes each independent
        operation or a mechanical check that rejects the compound shape.
      non_violation: |
        Record which quoted implementation steps are internal to the one
        declared operation.
  - id: P8.2
    rule: |
      Workflow ordering and branching remain in MachineSpec while one boundary
      adapter's protocol, validation, and result reduction remain
      implementation structure.
    pairs:
      producer: |
        Join every boundary ToolDef and machine action to its adapter
        Command.Execute and the directly called child, transport, or protocol
        functions.
      declaration: |
        The parent MachineSpec transition plus the boundary ToolDef inputs,
        outcomes, effects, and child profile reference.
      implementation: |
        The matched adapter and its directly called protocol, validation,
        reduction, and effect-owning functions.
    question: |
      Does this implementation choose agent-visible workflow order or branching
      that the supplied MachineSpec could express?
    evidence_required:
      declaration: |
        Quote the parent transition, boundary operation, declared outcomes, and
        authority passed to the child.
      implementation: |
        Quote the ordering or branch and show the independently meaningful
        state, signal, effect, or rollback boundary it hides.
    labeled_examples:
      violations:
      - label: extract_task (GH-1560)
        basis: |
          The implementation performed a graph lifecycle transition that was
          invisible in two of three machines.
      non_violations:
      - label: self_invoke
        basis: |
          The adapter launches one child profile and returns one parent signal;
          the child machine owns its internal workflow.
      - label: otlp_receiver_launch
        basis: |
          Binding one listener and registering its declared services implements
          one boundary operation and one rollback boundary.
    disposition:
      confirmed: |
        Cite P8.2 and propose a conformance test for the hidden transition or a
        mechanical check that requires the state, signal, or effect in
        MachineSpec.
      non_violation: |
        Record why the quoted sequence is protocol or validation structure
        inside one declared boundary operation.
