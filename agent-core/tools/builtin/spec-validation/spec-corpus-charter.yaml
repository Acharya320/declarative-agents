id: builtin-spec-corpus
title: Built-in Specification Corpus Checks
checks:
  - id: spec-corpus
    kind: spec_corpus
    severity: error
  # A clarification marker is a decision nobody has made; a corpus carrying
  # one is not ready (design.yaml clarification_marker). The constitutions
  # that define the marker necessarily spell it out and are excluded.
  - id: unresolved-clarification
    kind: grep_check
    severity: error
    include:
      - docs/**/*.yaml
      - docs/**/*.md
    exclude:
      - docs/constitutions/design.yaml
      - docs/constitutions/issue-format.yaml
    patterns:
      - "[NEEDS CLARIFICATION"
    message: A clarification marker remains; replace it with the decision in place (design.yaml clarification_marker).
