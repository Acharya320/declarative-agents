# The Agent CustomResourceDefinition (applications srd009 R1.1, R1.3). The
# operator embeds this file and applies it on boot; TestCRDMatchesTypes holds
# its schema to the Go types in api/v1alpha1.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agents.declarative-agents.nokia.com
spec:
  group: declarative-agents.nokia.com
  scope: Namespaced
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    singular: agent
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [profile, image]
              properties:
                profile:
                  type: object
                  required: [configMap, path]
                  properties:
                    configMap: {type: string, minLength: 1}
                    path: {type: string, minLength: 1}
                image: {type: string, minLength: 1}
                replicas: {type: integer, minimum: 0}
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                env:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                envFrom:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                args:
                  type: array
                  items: {type: string}
                podLabels:
                  type: object
                  additionalProperties: {type: string}
                serviceAccountName: {type: string}
                workVolumes:
                  type: array
                  items:
                    type: object
                    required: [name, mountPath]
                    properties:
                      name: {type: string, minLength: 1}
                      mountPath: {type: string, minLength: 1}
                      claimName: {type: string}
            status:
              type: object
              properties:
                observedGeneration: {type: integer}
                readyReplicas: {type: integer}
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
