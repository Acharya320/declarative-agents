# RBAC limited to what the reconciler touches (srd009 R4.1): Agents and
# their status, the Deployments and Services it owns, the profile ConfigMaps
# it reads, events, and the CRD it applies on boot.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-operator
  labels:
    {{- include "agent-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [declarative-agents.nokia.com]
    resources: [agents]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [declarative-agents.nokia.com]
    resources: [agents/status]
    verbs: [get, update, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-operator
  labels:
    {{- include "agent-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-operator
subjects:
  - kind: ServiceAccount
    name: agent-operator
    namespace: {{ .Release.Namespace }}
