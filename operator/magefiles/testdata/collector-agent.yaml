# The catalog collector as an Agent (applications srd009 R5.1): its profile
# directory and the units file it imports as one ConfigMap keyed
# <dir>__<file>, the image, and a work volume. The ports, the readiness
# probe, and the bind host come from the profile (R1.2). The proof
# substitutes the image.
apiVersion: declarative-agents.nokia.com/v1alpha1
kind: Agent
metadata:
  name: collector
spec:
  profile: {configMap: collector-profile, path: collector/profile.yaml}
  image: AGENT_CORE_IMAGE
  workVolumes:
    - {name: work, mountPath: /work}
